<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Modo Chofer</title>
<style>
  body{margin:0;font-family:-apple-system,Segoe UI,Roboto,sans-serif;background:#f4f5f7;
    display:flex;align-items:center;justify-content:center;height:100vh;}
  .card{background:#fff;border-radius:16px;padding:28px;box-shadow:0 2px 10px rgba(0,0,0,.1);
    width:90%;max-width:360px;text-align:center;}
  h2{margin-top:0;font-size:18px;}
  select{width:100%;padding:10px;margin:8px 0 16px;border:1px solid #ddd;border-radius:8px;
    font-size:14px;box-sizing:border-box;background:#fff;}
  .switch{position:relative;width:64px;height:36px;border-radius:20px;background:#9ca3af;
    margin:16px auto;cursor:pointer;transition:background .2s;}
  .switch.on{background:#16a34a;}
  .switch::after{content:"";position:absolute;top:3px;left:3px;width:30px;height:30px;
    border-radius:50%;background:#fff;transition:left .2s;}
  .switch.on::after{left:31px;}
  #status{font-size:14px;color:#555;margin-top:6px;}
  #err{color:#dc2626;font-size:13px;margin-top:10px;}
</style>
</head>
<body>
<div class="card">
  <h2>🚐 Modo Chofer</h2>
  <select id="linea"></select>
  <div class="switch" id="sw"></div>
  <div id="status">Fuera de servicio</div>
  <div id="err"></div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-database-compat.js"></script>
<script>
// ====== PEGA AQUÍ TU MISMA CONFIG DE FIREBASE (igual que en index.html) ======
const firebaseConfig = {
  apiKey: "AIzaSyCL0cYuNL9D_qvRmYSf88FpxzE17pORpFw",
  authDomain: "colectivogo-7a5a3.firebaseapp.com",
  databaseURL: "https://colectivogo-7a5a3-default-rtdb.firebaseio.com",
  projectId: "colectivogo-7a5a3",
  storageBucket: "colectivogo-7a5a3.firebasestorage.app",
  messagingSenderId: "879522062261",
  appId: "1:879522062261:web:c9e3304658dd9c889243fc"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

// ====== Líneas de taxis colectivos de La Serena (folio -> nombre) ======
const LINEAS = {
  5:"Línea 5 - Vista Hermosa", 6:"Línea 6 - La Herradura", 7:"Línea 7 - La Recova/Simón Bolívar",
  9:"Línea 9 - La Serena", 10:"Línea 10 - Centro/Parte Alta", 11:"Línea 11 - Las Tinajas/Vista",
  13:"Línea 13 - San Juan", 14:"Línea 14 - Compañías Alta", 15:"Línea 15 - Baquedano/Porvenir/Victoria",
  20:"Línea 20 - El Agrado Peñuelas", 21:"Línea 21 - Tierras Blancas", 22:"Línea 22",
  23:"Línea 23 - El Olivar", 24:"Línea 24 - Vista Hermosa", 28:"Línea 28 - Comser",
  30:"Línea 30 - Vista Hermosa/El Indio", 31:"Línea 31 - Las Compañías", 32:"Línea 32",
  33:"Línea 33 - Alfa Centauro", 34:"Línea 34 - Vista Hermosa", 35:"Línea 35 - Vista Hermosa",
  36:"Línea 36", 37:"Línea 37 - Socoset", 38:"Línea 38", 39:"Línea 39 - Las Compañías Centro",
  41:"Línea 41", 42:"Línea 42 - Calvario/San Juan", 44:"Línea 44 - Transblanca",
  45:"Línea 45 - Villa El Parque", 48:"Línea 48 - San Pedro del Mar", 59:"Línea 59 - San Carlos",
  61:"Línea 61 - Barrio Universitario", 63:"Línea 63 - Acosnavi", 65:"Línea 65",
  67:"Línea 67 - Las Torres/San Juan", 70:"Línea 70 - Bosque San Carlos", 73:"Línea 73 - Bellavista",
  75:"Línea 75 - Tierras Blancas", 77:"Línea 77 - San Juan"
};
// Color único por línea, calculado a partir del folio (mismo cálculo que en index.html)
function colorFor(folio){
  const hue = (folio * 137.508) % 360;
  return `hsl(${hue}, 75%, 45%)`;
}

const lineaSelect = document.getElementById('linea');
// Llena el select con las líneas
Object.entries(LINEAS).forEach(([folio, nombre]) => {
  const opt = document.createElement('option');
  opt.value = folio;
  opt.textContent = nombre;
  lineaSelect.appendChild(opt);
});
const savedFolio = localStorage.getItem('choferFolioLinea');
if (savedFolio) lineaSelect.value = savedFolio;

// ID único para este chofer/dispositivo (se guarda en el navegador)
let myId = localStorage.getItem('choferId');
if (!myId) {
  myId = 'chofer_' + Math.random().toString(36).slice(2,9);
  localStorage.setItem('choferId', myId);
}
const myRef = db.ref('colectivos/' + myId);

const sw = document.getElementById('sw');
const status = document.getElementById('status');
const err = document.getElementById('err');

let watchId = null;
let on = false;

sw.onclick = () => {
  on = !on;
  sw.classList.toggle('on', on);
  if (on) {
    startSharing();
  } else {
    stopSharing();
  }
};

function startSharing(){
  if (!navigator.geolocation) {
    err.textContent = 'Este navegador no soporta geolocalización.';
    return;
  }
  status.textContent = 'En servicio — compartiendo ubicación';
  const folio = parseInt(lineaSelect.value, 10);
  localStorage.setItem('choferFolioLinea', folio);

  watchId = navigator.geolocation.watchPosition(pos => {
    myRef.set({
      lat: pos.coords.latitude,
      lng: pos.coords.longitude,
      folioLinea: folio,
      linea: LINEAS[folio],
      color: colorFor(folio),
      timestamp: Date.now()
    });
    err.textContent = '';
  }, e => {
    err.textContent = 'Error de ubicación: ' + e.message;
  }, { enableHighAccuracy:true, maximumAge:5000, timeout:10000 });

  // Si se cierra la pestaña sin apagar el switch, borra el registro
  window.addEventListener('beforeunload', stopSharing);
}

function stopSharing(){
  status.textContent = 'Fuera de servicio';
  if (watchId !== null) navigator.geolocation.clearWatch(watchId);
  myRef.remove();
}
</script>
</body>
</html>
